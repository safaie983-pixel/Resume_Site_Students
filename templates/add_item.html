{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 style="margin-bottom: 10px;">{{ title }}</h1>
<p style="color: #94a3b8; margin-bottom: 30px; font-size: 14px;">اطلاعات رو پر کن و ذخیره بزن</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit">💾 ذخیره</button>
        <a href="{% url 'dashboard' %}" class="btn" style="background: rgba(100, 116, 139, 0.3); box-shadow: none;">انصراف</a>
    </div>
</form>
{% endblock %}
